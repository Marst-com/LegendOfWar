
name: LegendOfWar Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LegendOfWar APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. 소스 코드 다운로드
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK 설치
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Android SDK 패키지 설치
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --version

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. 프로젝트 파일 확인
      - name: Inspect project structure
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== Repository root ==="
          pwd
          ls -la

          echo "=== Gradle files ==="
          find . -maxdepth 4 \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "gradle-wrapper.properties" \
            -o -name "gradlew" \) \
            -type f -print

          if [ ! -d app ]; then
            echo "ERROR: app directory is missing."
            exit 1
          fi

          if [ ! -f app/build.gradle.kts ] \
             && [ ! -f app/build.gradle ]; then
            echo "ERROR: app Gradle build file is missing."
            exit 1
          fi

          if [ ! -f settings.gradle.kts ] \
             && [ ! -f settings.gradle ]; then
            echo "ERROR: settings.gradle(.kts) is missing."
            exit 1
          fi

      # 6. Gradle 설치
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # 7. Gradle Wrapper 생성
      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      # 8. APK 빌드
      - name: Build debug APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          ./gradlew \
            --no-daemon \
            --stacktrace \
            --info \
            assembleDebug \
            2>&1 | tee build-debug.log

      # 9. 빌드 로그 저장
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendOfWar-build-logs
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 7

      # 10. 빌드 실패 처리
      - name: Report build failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          echo "APK build failed."
          echo "Download the LegendOfWar-build-logs artifact."
          exit 1

      # 11. APK 업로드
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LegendOfWar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
