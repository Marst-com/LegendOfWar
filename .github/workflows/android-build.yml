
name: LegendOfWar Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Diagnose Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          java -version

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"

          ls -la "$SDK" || true
          ls -la "$SDK/cmdline-tools" || true
          ls -la "$SDK/platforms" || true
          ls -la "$SDK/build-tools" || true

          find "$SDK/cmdline-tools" \
            -maxdepth 3 -type f -name sdkmanager -print 2>&1 || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" \
              -maxdepth 3 -type f -name sdkmanager \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found or is not executable."
            exit 1
          fi

          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify project files
        shell: bash
        run: |
          set -euxo pipefail

          ls -la

          test -d app
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f settings.gradle.kts -o -f settings.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info assembleDebug \
            2>&1 | tee build-debug.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendOfWar-build-logs
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LegendOfWar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
