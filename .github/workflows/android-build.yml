
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper if missing
        shell: bash
        run: |
          set -euxo pipefail

          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: settings.gradle(.kts) is missing from repository root."
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Build APK with diagnostic log
        id: gradle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace --info assembleDebug \
            2>&1 | tee build-debug.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LegendOfWar-build-logs
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if build failed
        if: steps.gradle.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LegendOfWar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
